<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>

    <!-- Outer Hexagon Gradient -->
    <linearGradient id="taizer-outer-hex" x1="50" y1="50" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="taizer-emerald-accent" x1="100" y1="75" x2="400" y2="425" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Inner T Monogram Gradient -->
    <linearGradient id="taizer-t-gradient" x1="150" y1="125" x2="350" y2="425" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Rounded App Icon Container -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!-- Outer Hexagonal Crypto Shield -->
  <g transform="translate(6, 6) scale(5.0)" filter="url(#glow)">
    <polygon
      points="50,4 92,26 92,74 50,96 8,74 8,26"
      fill="url(#taizer-outer-hex)"
      stroke="url(#taizer-emerald-accent)"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- Inner Hexagon Ring Line -->
    <polygon
      points="50,12 84,30 84,70 50,88 16,70 16,30"
      fill="none"
      stroke="#334155"
      stroke-width="1.2"
      stroke-dasharray="4 2"
      opacity="0.7"
    />

    <!-- Glowing Blockchain Corner Nodes -->
    <circle cx="50" cy="4" r="2.5" fill="#34d399" />
    <circle cx="92" cy="26" r="2.5" fill="#34d399" />
    <circle cx="92" cy="74" r="2.5" fill="#34d399" />
    <circle cx="50" cy="96" r="2.5" fill="#34d399" />
    <circle cx="8" cy="74" r="2.5" fill="#34d399" />
    <circle cx="8" cy="26" r="2.5" fill="#34d399" />

    <!-- Top Bar of the T -->
    <path
      d="M26 31 C26 28.5, 28 26.5, 30.5 26.5 L69.5 26.5 C72 26.5, 74 28.5, 74 31 L69 40 L31 40 Z"
      fill="url(#taizer-emerald-accent)"
    />

    <!-- Center Vertical Stem of the T -->
    <path
      d="M44 38 L56 38 L54 75 L50 79 L46 75 Z"
      fill="url(#taizer-t-gradient)"
    />

    <!-- Left Wing Facet -->
    <polygon
      points="24,35 34,46 41,40 31,35"
      fill="#10b981"
      opacity="0.9"
    />

    <!-- Right Wing Facet -->
    <polygon
      points="76,35 66,46 59,40 69,35"
      fill="#059669"
      opacity="0.9"
    />

    <!-- Center Core Crypto Gem -->
    <polygon
      points="50,45 57,54 50,63 43,54"
      fill="#34d399"
    />
  </g>
</svg>
